name: enforce-single-branch

on:
  create:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-only-policy
  cancel-in-progress: false

jobs:
  prune:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Keep main as the only repository branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [[ "$branch" == "main" ]] && continue
            encoded=$(printf '%s' "$branch" | jq -sRr @uri)
            echo "Deleting non-main branch: $branch"
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded"
          done < <(gh api "repos/$REPOSITORY/branches" --paginate --jq '.[].name')
