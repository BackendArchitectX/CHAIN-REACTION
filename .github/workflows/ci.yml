name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-verify:
    name: Linux release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Repository verification
        run: npm run verify
      - name: Exercise Unix one-step launcher contract
        env:
          CHAIN_REACTION_PREFLIGHT_ONLY: '1'
          CHAIN_REACTION_SKIP_INSTALL: '1'
        run: ./start.sh
      - name: Upload assurance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-reaction-assurance-linux
          path: |
            dist/THIRD_PARTY_LICENSES.txt
            dist/build-manifest.json
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  windows-contract:
    name: Windows one-step contract
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Verify repository on Windows
        run: npm run verify
      - name: Exercise PowerShell one-step launcher contract
        shell: pwsh
        env:
          CHAIN_REACTION_PREFLIGHT_ONLY: '1'
          CHAIN_REACTION_SKIP_INSTALL: '1'
        run: .\run.ps1
      - name: Exercise CMD one-step launcher contract
        shell: cmd
        env:
          CHAIN_REACTION_PREFLIGHT_ONLY: '1'
          CHAIN_REACTION_SKIP_INSTALL: '1'
        run: start.cmd

  fresh-clone-startup:
    name: Fresh-clone one-step startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      CI: true
      CHAIN_REACTION_PREFLIGHT_ONLY: '1'
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: One-step startup from fresh Linux checkout
        if: runner.os == 'Linux'
        shell: bash
        run: ./start.sh
      - name: One-step startup from fresh Windows checkout
        if: runner.os == 'Windows'
        shell: cmd
        run: start.cmd
