name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-verify:
    name: Linux release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Repository verification
        run: npm run verify
      - name: Exercise Unix one-step launcher contract
        env:
          CHAIN_REACTION_PREFLIGHT_ONLY: '1'
          CHAIN_REACTION_SKIP_INSTALL: '1'
        run: ./start.sh
      - name: Upload assurance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-reaction-assurance-linux
          path: |
            dist/build-manifest.json
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  windows-contract:
    name: Windows one-step contract
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Verify repository on Windows
        run: npm run verify
      - name: Exercise PowerShell one-step launcher contract
        shell: pwsh
        env:
          CHAIN_REACTION_PREFLIGHT_ONLY: '1'
          CHAIN_REACTION_SKIP_INSTALL: '1'
        run: .\run.ps1
      - name: Exercise CMD one-step launcher contract
        shell: cmd
        env:
          CHAIN_REACTION_PREFLIGHT_ONLY: '1'
          CHAIN_REACTION_SKIP_INSTALL: '1'
        run: start.cmd
