name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Emit deterministic lockfile capsule
        run: node -e "const fs=require('fs'),z=require('zlib');console.log('LOCKFILE_GZIP_B64='+z.gzipSync(fs.readFileSync('package-lock.json')).toString('base64'))"
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm run verify
