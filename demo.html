<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAIN//REACTION — Premium MVP</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#edf1f4;background:#090b0e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#151b21 0,#090b0e 38%)}button{font:inherit}.app{min-height:100vh;max-width:1600px;margin:auto;padding:22px 24px 14px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #252b31;padding-bottom:18px}.brand{font-size:24px;letter-spacing:.12em;font-weight:800}.subtitle{font-size:10px;color:#7e8a94;letter-spacing:.22em;margin-top:7px}.topmeta{display:flex;gap:12px;align-items:center;color:#a5afb7;font-size:12px;letter-spacing:.1em}.pill{border:1px solid #333b43;padding:7px 10px;border-radius:999px}.live{color:#dce6ec}.nav{display:flex;gap:28px;padding:17px 0 18px}.nav button{background:none;border:0;color:#6f7981;letter-spacing:.12em;font-weight:700;font-size:11px;padding:8px 0;border-bottom:1px solid transparent;cursor:pointer}.nav button.active{color:#f3f6f8;border-color:#f3f6f8}.panel,.metric-card{background:linear-gradient(180deg,rgba(18,22,26,.96),rgba(12,15,18,.96));border:1px solid #252b31;border-radius:4px}.command-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.map-panel{min-height:545px;padding:16px}.side-stack{display:grid;gap:10px}.panel-title{display:flex;justify-content:space-between;color:#78838c;font-size:10px;font-weight:800;letter-spacing:.15em;margin-bottom:10px}.network{height:460px;position:relative;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}.network svg{position:absolute;inset:0;width:100%;height:100%}.edge{stroke:#3f4951;stroke-width:.45;opacity:.75}.edge.stressed{stroke:#969178}.edge.degraded{stroke:#9d8173}.edge.critical,.edge.failed{stroke:#a25f5f}.node{position:absolute;transform:translate(-50%,-50%);display:grid;min-width:118px;padding:10px 12px;background:#11161a;border:1px solid #364049;box-shadow:0 8px 22px rgba(0,0,0,.28)}.node b{font-size:10px;letter-spacing:.08em}.node small{font-size:9px;color:#68737b;margin-top:3px}.node span{font-size:9px;color:#9aa4ac;margin-top:8px}.node-glyph{font-size:17px;margin-bottom:6px}.node.stressed{border-color:#77715a}.node.degraded{border-color:#785f53}.node.critical,.node.failed{border-color:#7a4949}.node.recovering{border-color:#526d68}.legend{display:flex;gap:18px;color:#6d7780;font-size:9px;letter-spacing:.08em;padding-top:10px}.metric-card{padding:18px;display:flex;flex-direction:column;justify-content:center}.metric-card small{font-size:9px;letter-spacing:.16em;color:#657079}.metric-card strong{font-size:26px;letter-spacing:.04em;margin:8px 0}.metric-card span{font-size:10px;color:#7a858d;line-height:1.5}.metric-card.hero strong{font-size:34px}.danger{color:#d79696}.evidence-panel,.controls-panel{padding:16px;grid-column:1/2}.evidence-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #22292e}.evidence-row b{font-size:11px;letter-spacing:.06em}.evidence-row small{display:block;color:#657079;margin-top:4px;font-size:9px}.evidence-meta{display:flex;gap:18px;color:#9ba5ad;font-size:10px}.controls-panel{grid-column:2/3;grid-row:2/4}.control-buttons{display:grid;gap:9px}.control-buttons button{padding:12px 14px;text-align:left;background:#1a2025;border:1px solid #354049;color:#edf1f4;font-weight:700;letter-spacing:.07em;font-size:10px;cursor:pointer}.control-buttons button.warn{border-color:#69514d}.control-buttons button.ghost{background:transparent;color:#7d878f}.incident-note{margin-top:14px;color:#8c969e;font-size:11px;line-height:1.6}.single-column{display:grid;gap:14px}.single-column>.panel{padding:18px}.branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.branch-card{background:#0d1114;border:1px solid #2b333a;color:#dfe6eb;padding:18px;text-align:left;cursor:pointer}.branch-card.selected{border-color:#93a0a9;background:#12181c}.branch-card>small{display:block;color:#78838c;letter-spacing:.12em}.branch-card>strong{font-size:34px;display:block;margin:18px 0 2px}.branch-card>span{font-size:9px;color:#6f7981}.branch-kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.branch-kpis b{display:block;font-size:11px}.branch-kpis small{color:#626d75;font-size:8px}.future-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;padding:0!important;overflow:hidden}.future-summary>div{padding:18px;background:#101418}.future-summary small{display:block;color:#68737b;font-size:8px;letter-spacing:.12em}.future-summary strong{display:block;margin-top:8px;font-size:12px}.why-card p{color:#8f9aa2;line-height:1.7;font-size:12px;max-width:1000px}.coverage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#252b31}.coverage{background:#0f1316;padding:14px 16px;display:flex;justify-content:space-between;font-size:11px}.edge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.edge-metric{padding:16px;background:#0f1316;border:1px solid #242b31}.edge-metric small{display:block;color:#66717a;font-size:8px;letter-spacing:.13em}.edge-metric strong{display:block;font-size:12px;margin-top:10px}.notice{margin-top:14px;padding:14px;border-left:2px solid #59646c;background:#0e1215;color:#7f8a92;font-size:11px;line-height:1.6}.audit-row{display:grid;grid-template-columns:90px 100px 1fr 120px;gap:12px;padding:12px 0;border-top:1px solid #22292e;align-items:center;font-size:10px}.audit-row code{color:#738089}.tag{font-size:8px;letter-spacing:.1em}.tag.observed{color:#a5b9b1}.tag.predicted{color:#a7a0b8}.tag.assumed{color:#b2a68f}footer{margin-top:14px;border-top:1px solid #242a30;padding:12px 2px;display:flex;gap:26px;color:#59646c;font-size:9px;letter-spacing:.1em}footer b{color:#a3adb4}@media(max-width:1000px){.command-grid{grid-template-columns:1fr}.side-stack{grid-template-columns:repeat(2,1fr)}.controls-panel,.evidence-panel{grid-column:auto;grid-row:auto}.branch-grid,.edge-grid{grid-template-columns:1fr 1fr}.future-summary{grid-template-columns:1fr 1fr}.topmeta{display:none}}@media(max-width:650px){.app{padding:14px}.nav{gap:12px;overflow:auto}.side-stack,.branch-grid,.edge-grid{grid-template-columns:1fr}.network{height:420px}.node{min-width:94px;padding:7px}.future-summary{grid-template-columns:1fr}.audit-row{grid-template-columns:1fr}.legend{flex-wrap:wrap}}
</style></head><body><div class="app"><header class="topbar"><div><div class="brand">CHAIN//REACTION</div><div class="subtitle">EDGE CAUSAL RESILIENCE INTELLIGENCE</div></div><div class="topmeta"><span>CITY//01</span><span class="pill">SIMULATION MODE</span><span class="live">● LIVE</span></div></header><nav class="nav" id="nav"></nav><div id="view"></div><footer><span>EDGE PULSE <b>● READY</b></span><span>NPU <b>● CAPABILITY MOCK</b></span><span>TRUST <b id="trustFooter">VERIFIED</b></span><span>CLOUD <b>0</b></span></footer></div><script>
const statusGlyph={healthy:'●',stressed:'◐',degraded:'▲',critical:'◆',failed:'×',recovering:'↻'};const statusLabel={healthy:'HEALTHY',stressed:'STRESSED',degraded:'DEGRADED',critical:'CRITICAL',failed:'FAILED',recovering:'RECOVERING'};
const baseNodes=[['sub03','SUBSTATION 03','Power','healthy',92,24,16,43],['tel07','TELECOM 07','Telecom','healthy',88,100,43,30],['hospN','HOSPITAL NORTH','Healthcare','healthy',84,78,76,18],['pump02','PUMP 02','Water','healthy',86,64,43,66],['road12','ROAD 12','Transport','healthy',91,100,77,60],['ems01','EMERGENCY OPS','Response','healthy',90,82,88,40]].map(([id,label,kind,status,capacity,reserve,x,y])=>({id,label,kind,status,capacity,reserve,x,y}));
const branches=[{name:'NO ACTION',robustness:42,safety:'REJECT',horizon:'—',debt:'HIGH',hospital:'critical',telecom:'failed',failures:4},{name:'REROUTE',robustness:81,safety:'PASS',horizon:'00:42',debt:'LOW',hospital:'stressed',telecom:'degraded',failures:2},{name:'REROUTE + MOBILE',robustness:94,safety:'PASS',horizon:'00:27',debt:'MEDIUM',hospital:'healthy',telecom:'healthy',failures:1}];
let state={tab:'COMMAND',t:0,roadBlocked:false,selectedBranch:2};
function nodes(){const ns=baseNodes.map(n=>({...n}));const set=(id,s,cap,res)=>{const n=ns.find(x=>x.id===id);n.status=s;if(cap!==undefined)n.capacity=cap;if(res!==undefined)n.reserve=res};if(state.t>=12)set('sub03','stressed',71,19);if(state.t>=36)set('sub03','degraded',52,15);if(state.t>=48)set('tel07','stressed',67,72);if(state.t>=72)set('tel07','degraded',49,43);if(state.t>=92)set('hospN','stressed',70,56);if(state.t>=112)set('hospN','degraded',54,41);if(state.roadBlocked)set('road12','failed',0,0);if(state.t>=96&&state.selectedBranch===2){set('tel07','recovering',73,50);set('hospN','healthy',82,68)}else if(state.t>=96&&state.selectedBranch===1){set('tel07','degraded',55,35);set('hospN','stressed',67,49)}else if(state.t>=96&&state.selectedBranch===0){set('tel07','failed',0,0);set('hospN','critical',33,19);set('ems01','degraded',58,35)}return ns}
function evidence(){return[['E-8127','CAMERA_02',state.t<12?'NORMAL SCENE':'FLOOD SCENE',state.t<12?.96:.91,'1.4 s','HIGH'],['E-8131','SENSOR_04',state.t<12?'WATER NORMAL':'WATER HIGH',state.t<12?.94:.89,'0.4 s','HIGH'],['E-8134','GRID_TELEM',state.t<24?'VOLTAGE NOMINAL':'VOLTAGE UNSTABLE',state.t<24?.97:.87,'0.8 s','HIGH']].map(([id,source,event,confidence,age,trust])=>({id,source,event,confidence,age,trust}))}
function lease(){return state.roadBlocked?'EXPIRED':state.t<72?'ACTIVE':'AT RISK'}function trust(){return state.roadBlocked&&state.selectedBranch===2?'DEGRADED':'VERIFIED'}function cascade(){return state.t<12?'—':`${Math.max(0,91-state.t)}s — ${Math.max(0,134-state.t)}s`}function horizon(){return state.t<12?'—':`${Math.max(0,27-Math.max(0,state.t-48))}s`}
function nav(){const tabs=['COMMAND','FUTURES','CHAOS LAB','EDGE LAB','AUDIT'];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
function network(){const ns=nodes(),by=Object.fromEntries(ns.map(n=>[n.id,n])),lines=[['sub03','tel07'],['sub03','pump02'],['tel07','hospN'],['tel07','ems01'],['road12','ems01'],['pump02','road12']];return `<div class="network"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${lines.map(([a,b])=>`<line x1="${by[a].x}" y1="${by[a].y}" x2="${by[b].x}" y2="${by[b].y}" class="edge ${by[a].status}"/>`).join('')}</svg>${ns.map(n=>`<div class="node ${n.status}" style="left:${n.x}%;top:${n.y}%"><div class="node-glyph">${statusGlyph[n.status]}</div><b>${n.label}</b><small>${n.kind}</small><span>${n.capacity}% CAP</span></div>`).join('')}</div>`}
function command(){return `<main class="command-grid"><section class="panel map-panel"><div class="panel-title"><span>LIVING CAUSAL TWIN</span><span>T+${state.t}s</span></div>${network()}<div class="legend">${Object.keys(statusGlyph).map(s=>`<span>${statusGlyph[s]} ${statusLabel[s]}</span>`).join('')}</div></section><aside class="side-stack"><section class="metric-card hero"><small>CASCADE WINDOW</small><strong>${cascade()}</strong><span>Hospital North communications risk</span></section><section class="metric-card hero"><small>DECISION HORIZON</small><strong>${horizon()}</strong><span>Latest safe commit for Mobile Unit</span></section><section class="metric-card"><small>FORECAST LEASE</small><strong class="${lease()==='EXPIRED'?'danger':''}">${lease()}</strong><span>Snapshot WS-${1442+state.t}</span></section><section class="metric-card"><small>EVIDENCE AGREEMENT</small><strong>${state.t<12?'NOMINAL':'HIGH'}</strong><span>3 active evidence sources</span></section></aside><section class="panel evidence-panel"><div class="panel-title"><span>EVIDENCE FABRIC</span><span>OBSERVED</span></div>${evidence().map(e=>`<div class="evidence-row"><div><b>${e.event}</b><small>${e.source} · ${e.id}</small></div><div class="evidence-meta"><span>${Math.round(e.confidence*100)}%</span><span>${e.age}</span><span>${e.trust}</span></div></div>`).join('')}</section><section class="panel controls-panel"><div class="panel-title"><span>MONSOON ZERO</span><span>CONTROL</span></div><div class="control-buttons"><button id="advance">ADVANCE +12s</button><button id="road" class="warn">INJECT ROAD_12 BLOCK</button><button id="reset" class="ghost">RESET</button></div><div class="incident-note">${state.roadBlocked?'NEW EVIDENCE: ROAD_12 BLOCKED. Previous plan assumptions invalidated.':state.t<12?'All systems nominal. Advance the scenario to begin the incident.':'Flood evidence confirmed. Substation 03 is degrading and downstream risk is propagating.'}</div></section></main>`}
function futures(){const b=branches[state.selectedBranch];return `<main class="single-column"><section class="panel"><div class="panel-title"><span>REALITY FORKS</span><span>SYNCHRONIZED @ T+${state.t}s</span></div><div class="branch-grid">${branches.map((x,i)=>`<button class="branch-card ${state.selectedBranch===i?'selected':''}" data-branch="${i}"><small>${x.name}</small><strong>${x.robustness}%</strong><span>ROBUSTNESS</span><div class="branch-kpis"><div><b>${x.safety}</b><small>Safety</small></div><div><b>${x.horizon}</b><small>Decision Horizon</small></div><div><b>${x.failures}</b><small>Failures</small></div><div><b>${x.debt}</b><small>Recovery Debt</small></div></div></button>`).join('')}</div></section><section class="panel future-summary"><div><small>SELECTED BRANCH</small><strong>${b.name}</strong></div><div><small>HOSPITAL NORTH</small><strong>${statusLabel[b.hospital]}</strong></div><div><small>TELECOM 07</small><strong>${statusLabel[b.telecom]}</strong></div><div><small>SAFETY KERNEL</small><strong>${b.safety}</strong></div><div><small>FORECAST LEASE</small><strong>${lease()}</strong></div></section><section class="panel why-card"><div class="panel-title"><span>WHY DIFFERENT?</span><span>CAUSAL TRACE CT-001842</span></div><p>Mobile Unit 01 maintains Telecom 07 above its critical capacity threshold. That prevents Hospital North from entering backup depletion in the selected branch. If ROAD_12 becomes blocked, this assumption expires and the plan must be recomputed.</p></section></main>`}
function chaos(){const tests=[['Stale telemetry','PASS'],['Duplicate event','PASS'],['Late event','PASS'],['Contradictory evidence','PASS'],['Unknown camera input','PASS'],['NPU unavailable','DESIGNED'],['Network offline','PASS'],['No safe plan','PASS'],['Application restart','DESIGNED'],['Second shock','PASS']];return `<main class="single-column"><section class="panel"><div class="panel-title"><span>CHAOS LAB</span><span>RED-TEAM THE SYSTEM</span></div><div class="coverage-grid">${tests.map(x=>`<div class="coverage"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section><section class="panel controls-panel" style="grid-column:auto;grid-row:auto"><div class="panel-title"><span>FAULT INJECTION</span><span>CITY//01</span></div><div class="control-buttons"><button id="road2" class="warn">ROAD_12 BLOCK</button><button id="advance2">ADVANCE CASCADE</button><button id="reset2" class="ghost">RESET WORLD</button></div></section></main>`}
function edge(){const ms=[['Architecture','ARM64 target'],['Runtime','ONNX Runtime / QNN planned'],['NPU proof','Requires device profile'],['Cloud inference','0'],['Model artifact','Capability-resolved'],['Safety Kernel','Deterministic'],['Scenario','MONSOON ZERO'],['Simulation','Seeded / reproducible']];return `<main class="single-column"><section class="panel"><div class="panel-title"><span>EDGE LAB</span><span>SNAPDRAGON DEPLOYMENT CONTRACT</span></div><div class="edge-grid">${ms.map(x=>`<div class="edge-metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="notice">This MVP intentionally does not fake NPU execution. Replace the capability placeholders only after successful compilation, execution, and per-layer profiling on the exact Snapdragon-powered HP target.</div></section></main>`}
function audit(){let es=[['19:42:08','OBSERVED','Flood scene evidence accepted','E-8127'],['19:42:20','PREDICTED','Substation 03 enters STRESSED','CT-001801'],['19:42:31','PREDICTED','Hospital risk window created','F-8291'],['19:42:33','ASSUMED','Telecom reserve 100–145s','A-442']];if(state.roadBlocked)es.push(['19:43:12','OBSERVED','ROAD_12 blocked — plan invalidated','E-8188']);return `<main class="single-column"><section class="panel"><div class="panel-title"><span>AUDIT</span><span>TAMPER-EVIDENT DESIGN</span></div>${es.map(e=>`<div class="audit-row"><span>${e[0]}</span><b class="tag ${e[1].toLowerCase()}">${e[1]}</b><span>${e[2]}</span><code>${e[3]}</code></div>`).join('')}</section><section class="panel future-summary"><div><small>SCENARIO</small><strong>MONSOON ZERO</strong></div><div><small>SEED</small><strong>271828</strong></div><div><small>TRACE</small><strong>CRX-${271828+state.t}</strong></div><div><small>SIMULATION BOUNDARY</small><strong>CITY//01</strong></div><div><small>TRUST STATE</small><strong>${trust()}</strong></div></section></main>`}
function wire(){const q=id=>document.getElementById(id);if(q('advance'))q('advance').onclick=()=>{state.t=Math.min(140,state.t+12);render()};if(q('advance2'))q('advance2').onclick=()=>{state.t=Math.min(140,state.t+12);render()};if(q('road'))q('road').onclick=()=>{state.roadBlocked=true;state.t=Math.max(state.t,72);render()};if(q('road2'))q('road2').onclick=()=>{state.roadBlocked=true;state.t=Math.max(state.t,72);render()};if(q('reset'))q('reset').onclick=reset;if(q('reset2'))q('reset2').onclick=reset;document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{state.selectedBranch=Number(b.dataset.branch);render()})}
function reset(){state.t=0;state.roadBlocked=false;state.selectedBranch=2;render()}function render(){nav();const view=document.getElementById('view');view.innerHTML=state.tab==='COMMAND'?command():state.tab==='FUTURES'?futures():state.tab==='CHAOS LAB'?chaos():state.tab==='EDGE LAB'?edge():audit();document.getElementById('trustFooter').textContent=trust();wire()}render();
</script></body></html>
